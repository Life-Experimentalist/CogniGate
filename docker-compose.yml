# CogniGate reference deployment.
#
# Copy `.env.example` to `.env` and fill it in before running:
#   cp .env.example .env
#   openssl rand -hex 32   # -> ANALYTICS_TOKEN
#   openssl rand -hex 24   # -> GATEWAY_BOOTSTRAP_KEY
#
# Compose reads `.env` from this directory automatically.
#
#   docker compose up -d --wait
#
# Every service is health-checked, so `--wait` returns only once the whole stack
# is actually serving rather than merely started (GW-11). The two images we build
# carry their own `HEALTHCHECK` — gateway on /healthz, analytics on
# /actuator/health — which compose honours; postgres is checked here instead,
# because the stock image ships without one.

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # The one credential that exists before any tenant does: it is how the
      # first tenant, and therefore the first API key, gets created. No default,
      # because a reference deployment that ships with a known admin credential
      # is a reference deployment nobody should copy.
      - CG_ADMIN_BOOTSTRAP_KEY=${GATEWAY_BOOTSTRAP_KEY:?generate one with `openssl rand -hex 24`}
      # Usage accounting goes to the analytics service, which writes it to
      # Postgres; without this the gateway keeps every usage row in its own
      # memory and a restart loses the lot. There is deliberately no
      # `depends_on` for analytics: the gateway builds the client but does not
      # dial it, buffers what it cannot deliver, and drains the backlog when
      # analytics answers. Waiting would mean an outage in one service becoming
      # an outage in the other (GW-11.AC-3).
      - ANALYTICS_URL=http://analytics:8081
      - ANALYTICS_TOKEN=${ANALYTICS_TOKEN:?generate one with `openssl rand -hex 32`}
      # Hard caps reject ("on") or are only reported ("observe"). Threaded
      # through rather than left to the binary's default: "observe" is how an
      # operator sizes quotas before turning them into rejections, and
      # GW-4.AC-8 is only reachable against a gateway actually running in it.
      # Certifying both modes takes two runs, which is the honest cost of a
      # setting that changes what the gateway does.
      - CG_QUOTA_ENFORCEMENT=${QUOTA_ENFORCEMENT:-on}
      # Response caching (GW-12), off in the reference deployment because the
      # specification makes it opt-in: a gateway that replays answers is a
      # different gateway, and an operator should turn that on deliberately
      # rather than inherit it from a compose file they copied. Threaded through
      # for the same reason quota enforcement is — GW-12's criteria are only
      # reachable against a deployment that has it on, and its AC-7 only against
      # one that has it off.
      - CG_CACHE_ENABLED=${CACHE_ENABLED:-false}
    networks:
      - cogni-net

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-cognigate}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-cognigate_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-cognigate_pass}
      # The same value the gateway is given above. Port 8081 is published to
      # the host and /api/** is how usage is written, so this is the only thing
      # between that and anyone who can reach the port. No default, because a
      # reference deployment that ships with a known credential is a reference
      # deployment nobody should copy.
      - ANALYTICS_TOKEN=${ANALYTICS_TOKEN:?generate one with `openssl rand -hex 32`}
    networks:
      - cogni-net
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cognigate}
      - POSTGRES_USER=${POSTGRES_USER:-cognigate_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cognigate_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cogni-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognigate_user} -d ${POSTGRES_DB:-cognigate}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  cogni-net:
    driver: bridge

volumes:
  pgdata:

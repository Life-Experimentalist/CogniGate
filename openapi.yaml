# Generated by scripts/gen_openapi.py. Regenerate rather than hand-editing:
#
#     python scripts/gen_openapi.py
#
# The path set is reconciled against the gateway's own route table, in
# both directions, by gateway/internal/server/openapi_test.go.
openapi: 3.1.0
info:
  title: CogniGate API
  version: 1.0.0
  summary: 'Self-hosted OpenAI-compatible gateway: routing, quotas, caching and metering across
    providers.'
  description: |
    One process serves both planes on one port.

    - **The data plane**, under `/v1`, is OpenAI-compatible. An existing SDK pointed at this base URL works unchanged, errors included.
    - **The admin plane**, under `/admin/v1`, configures tenants, keys, providers, aliases, routes, quotas and webhooks.

    A key is minted for exactly one plane and is never valid on the other; presenting a data key to `/admin/v1` fails with `wrong_plane` rather than with a 404.

    This document describes every route the gateway serves. A reconciliation test compares it against the running route table in both directions, so a route added without an entry here — or an entry here for a route that does not exist — fails the build.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: The reference deployment. Both planes are on this one origin.
tags:
- name: Chat
  description: The OpenAI-compatible completion endpoint.
- name: Models
  description: Catalog discovery and alias resolution.
- name: Usage
  description: Metering and quota state.
- name: Operations
  description: Health, capability discovery and the Prometheus scrape.
- name: Admin
  description: Deployment-wide control-plane operations.
- name: Tenants
  description: The unit of isolation.
- name: Tenant keys
  description: Credentials scoped to one tenant.
- name: Admin keys
  description: Root credentials, which belong to no tenant.
- name: Providers
  description: Upstream accounts.
- name: Aliases
  description: Stable names for models that change.
- name: Routing
  description: Fallback chains.
- name: Quotas
  description: Token and spend ceilings.
- name: Cache
  description: The response cache.
- name: Captures
  description: Opt-in body retention for debugging.
- name: Webhooks
  description: Event delivery and the polling floor under it.
paths:
  /healthz:
    get:
      tags:
      - Operations
      operationId: healthz
      summary: Liveness probe.
      description: |
        Deliberately unauthenticated and deliberately thin: anything that can reach the socket can read it, so it carries no build version. `/v1/health` and `/v1/meta` report the version, and both require a credential.
      security: []
      responses:
        '200':
          description: Serving.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: Draining. The process is refusing new work while it finishes what it
            has; a load balancer should stop sending here.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: draining
  /metrics:
    get:
      tags:
      - Operations
      operationId: metrics
      summary: Prometheus scrape.
      description: |
        The GW-8 exposition for the gateway process. Unauthenticated by default, because the thing that scrapes it is a sidecar with no notion of tenant credentials; setting `metrics.token` puts it behind a bearer token. The path is configurable and the endpoint can be turned off entirely, so a deployment may not serve this at all — `GET /v1/meta` reports whether it does.

        The analytics engine publishes its own scrape at `GET /metrics` on port 8081. That is a separate process and is not described by this document.
      security: []
      responses:
        '200':
          description: The exposition, in the Prometheus text format. No series carries request
            or response content.
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/chat/completions:
    post:
      tags:
      - Chat
      operationId: createChatCompletion
      summary: Create a chat completion.
      description: |
        The OpenAI-compatible entry point. `model` may be a real model id, an alias (GW-2) or the match side of a routing rule (GW-3); what actually served the request is reported in the response body and in X-CogniGate-Served-By.

        With `"stream": true` the response is `text/event-stream`. A stream that stalls terminates with an SSE error event carrying code `upstream_stream_stalled` — the HTTP status line was already sent, so it cannot be a status.
      security:
      - DataKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              model: gpt-4o-mini
              messages:
              - role: user
                content: Hello.
      responses:
        '200':
          description: A completion.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-CogniGate-Served-By:
              $ref: '#/components/headers/ServedBy'
            X-CogniGate-Fallback-Depth:
              $ref: '#/components/headers/FallbackDepth'
            X-CogniGate-Quota-State:
              $ref: '#/components/headers/QuotaState'
            X-CogniGate-Cache:
              $ref: '#/components/headers/Cache'
            X-CogniGate-Debug-Capture:
              $ref: '#/components/headers/DebugCapture'
            X-CogniGate-Deprecation:
              $ref: '#/components/headers/Deprecation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
            text/event-stream:
              schema:
                type: string
                description: 'Server-sent events. Each `data:` line is an OpenAI `chat.completion.chunk`,
                  and the stream ends with `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/models:
    get:
      tags:
      - Models
      operationId: listModels
      summary: List available models.
      description: |
        Every model the tenant's providers advertise (GW-1), plus its aliases (GW-2), in OpenAI's list shape. Aliases are marked `cognigate.alias` and carry what they currently resolve to.
      security:
      - DataKey: []
      responses:
        '200':
          description: The catalog.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/models/{model}:
    get:
      tags:
      - Models
      operationId: getModel
      summary: Retrieve one model or alias.
      description: |
        Send the id raw. A model id routinely contains a slash — `meta-llama/Llama-3-70b` is an ordinary id at several providers — and the route captures the whole remainder of the path, so the slashes need no escaping. An OpenAPI path parameter cannot express that, which is the one place a generated client needs a hand: the gateway does not percent-decode this segment, so a client that encodes the slash as `%2F` will look up a model whose id contains those three characters and get a 404.
      security:
      - DataKey: []
      parameters:
      - name: model
        in: path
        required: true
        description: A model id or an alias name.
        schema:
          type: string
      responses:
        '200':
          description: The entry.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/usage:
    get:
      tags:
      - Usage
      operationId: getUsage
      summary: Usage and quota state for the calling tenant.
      description: |
        The same window the quota rejections are computed over, so a caller asking why it was refused sees the figures the refusal used.
      security:
      - DataKey: []
      parameters:
      - name: window
        in: query
        description: The period to report over.
        schema:
          type: string
          enum:
          - day
          - month
          default: day
      responses:
        '200':
          description: Totals and every quota slot that applies.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/usage/breakdown:
    get:
      tags:
      - Usage
      operationId: getUsageBreakdown
      summary: Usage broken down by one dimension.
      description: |
        Rows are ordered by spend. At most 200 are returned; when there were more, `truncated` is true and the cheapest were dropped.
      security:
      - DataKey: []
      parameters:
      - name: window
        in: query
        description: The period to report over.
        schema:
          type: string
          enum:
          - day
          - month
          default: day
      - name: group_by
        in: query
        description: The dimension to aggregate on.
        schema:
          type: string
          enum:
          - model
          - provider
          - key
          - client_request_id
          default: model
      responses:
        '200':
          description: The breakdown.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageBreakdown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Dependency and configuration health for the calling tenant.
      description: |
        Answers 200 whatever the status field says: this reports on the deployment, and a non-2xx would make the report itself unreadable to the client that needs it. Outside the rate limit, so a client polling it during an incident is not the thing that exhausts its own budget.
      security:
      - DataKey: []
      responses:
        '200':
          description: The report.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/meta:
    get:
      tags:
      - Operations
      operationId: getMeta
      summary: What this deployment is and what it supports.
      description: |
        GW-9 makes this the supported way to feature-detect: a client reads `features` and `capabilities` rather than probing endpoints to see what answers. Outside the rate limit, for the same reason `/v1/health` is.
      security:
      - DataKey: []
      responses:
        '200':
          description: The descriptor.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/v1/meta:
    get:
      tags:
      - Admin
      operationId: getAdminMeta
      summary: What the calling admin key can do.
      description: |
        Reports the credential's own scope and the full event vocabulary a webhook may subscribe to, so an operator does not have to discover event types by triggering them.
      security:
      - AdminKey: []
      responses:
        '200':
          description: The descriptor.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/catalog/refresh:
    post:
      tags:
      - Admin
      operationId: refreshCatalog
      summary: Re-discover provider catalogs now.
      description: |
        Without this a model added or retired at a provider only becomes visible when the TTL expires. A root key with no body refreshes every tenant; naming one narrows it. A tenant-scoped key is narrowed to its own, and naming another is a 404.
      security:
      - AdminKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant:
                  type: string
                  description: Refresh only this tenant.
      responses:
        '200':
          description: One result row per tenant refreshed.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/audit:
    get:
      tags:
      - Admin
      operationId: listAudit
      summary: Read the admin audit log.
      description: |
        Append-only, newest first, and it includes refused writes: an attempt to reach another tenant is exactly what this log is read to find, and one that succeeded is not more interesting than one that did not.
      security:
      - AdminKey: []
      parameters:
      - name: limit
        in: query
        description: Page size, 1 to 200. A value outside the range is refused rather than
          clamped, because a clamped short page is indistinguishable from a genuine last page.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        description: 'Cursor: the `id` of the last item the caller saw. An unknown cursor
          is refused rather than restarting from the beginning.'
        schema:
          type: string
      responses:
        '200':
          description: A page of entries.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/admin-keys:
    post:
      tags:
      - Admin keys
      operationId: createAdminKey
      summary: Mint a root admin key.
      description: |
        How a deployment rotates away from its bootstrap credential. Root keys belong to no tenant, so they are not under `/tenants` — minting one there would tie the credential that outranks every tenant to the lifetime of one of them. Requires a root key.
      security:
      - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                expires_at:
                  type: string
                  description: Must be in the future. Omit for a key that does not expire.
                  format: date-time
      responses:
        '201':
          description: Created. The secret is shown here and nowhere else.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintedKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
      - Admin keys
      operationId: listAdminKeys
      summary: List root admin keys.
      description: |
        Requires a root key.
      security:
      - AdminKey: []
      parameters:
      - name: limit
        in: query
        description: Page size, 1 to 200. A value outside the range is refused rather than
          clamped, because a clamped short page is indistinguishable from a genuine last page.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        description: 'Cursor: the `id` of the last item the caller saw. An unknown cursor
          is refused rather than restarting from the beginning.'
        schema:
          type: string
      responses:
        '200':
          description: A page of keys.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/admin-keys/{id}:
    delete:
      tags:
      - Admin keys
      operationId: revokeAdminKey
      summary: Revoke a root admin key.
      description: |
        There is deliberately no guard against revoking the last one: the bootstrap key is checked against the process environment rather than resolved through the store, so it survives any revocation here and remains the documented way back in.
      security:
      - AdminKey: []
      parameters:
      - name: id
        in: path
        required: true
        description: Key id.
        schema:
          type: string
      responses:
        '204':
          description: Revoked.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants:
    post:
      tags:
      - Tenants
      operationId: createTenant
      summary: Create a tenant.
      description: |
        Requires a root key.
      security:
      - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
      - Tenants
      operationId: listTenants
      summary: List tenants.
      description: |
        Requires a root key. A tenant-scoped key is refused rather than shown a one-row list: the tenant it belongs to is already named in every path it can reach, so the listing exists only for the operator view.
      security:
      - AdminKey: []
      parameters:
      - name: limit
        in: query
        description: Page size, 1 to 200. A value outside the range is refused rather than
          clamped, because a clamped short page is indistinguishable from a genuine last page.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        description: 'Cursor: the `id` of the last item the caller saw. An unknown cursor
          is refused rather than restarting from the beginning.'
        schema:
          type: string
      responses:
        '200':
          description: A page of tenants.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}:
    get:
      tags:
      - Tenants
      operationId: getTenant
      summary: Retrieve a tenant.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      responses:
        '200':
          description: The tenant. `warnings` carries any configuration the deployment accepted
            but would not have chosen — an override at the deployment ceiling, for instance.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - status
                - created_at
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                    - active
                    - suspended
                  created_at:
                    type: string
                    format: date-time
                  limits:
                    $ref: '#/components/schemas/TenantLimits'
                  cache:
                    $ref: '#/components/schemas/TenantCache'
                  debug_capture:
                    $ref: '#/components/schemas/TenantDebugCapture'
                  warnings:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - Tenants
      operationId: updateTenant
      summary: Update a tenant.
      description: |
        Requires a root key: a tenant may not lift its own limits or un-suspend itself. Absent and null are distinct: a body carrying only `status` leaves the name alone. `limits`, `cache` and `debug_capture` each replace their whole block rather than merging field by field, so an empty object clears every override — "send me the policy you want this tenant to have" is the only rule to remember.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum:
                  - active
                  - suspended
                limits:
                  $ref: '#/components/schemas/TenantLimits'
                cache:
                  $ref: '#/components/schemas/TenantCache'
                debug_capture:
                  $ref: '#/components/schemas/TenantDebugCapture'
      responses:
        '200':
          description: The updated tenant.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - Tenants
      operationId: deleteTenant
      summary: Delete a tenant and everything under it.
      description: |
        Requires a root key and `?confirm=` matching the tenant id in the path — the whole id rather than a bare `?confirm=true`, which a mis-pasted URL would satisfy. Cached responses and retained captures go with it: both are reachable only through credentials that have just ceased to exist, so leaving them would be retention with no reader.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      - name: confirm
        in: query
        required: true

          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - Quotas
      operationId: deleteTenantQuota
      summary: Remove a tenant quota.
      description: |
        The tenant becomes uncapped, subject to any per-key quotas that remain.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      responses:
        '204':
          description: Removed.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}/cache/flush:
    post:
      tags:
      - Cache
      operationId: flushTenantCache
      summary: Drop a tenant's cached responses.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      responses:
        '200':
          description: How many entries were dropped.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - flushed
                properties:
                  flushed:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}/captures:
    get:
      tags:
      - Captures
      operationId: listCaptures
      summary: Read retained request and response bodies.
      description: |
        The one route in the product that serves prompt content back out (GW-14). It returns something only for a tenant whose `debug_capture` an admin explicitly enabled, and that enabling is itself in the audit log. Entries are hard-deleted at their `expires_at`.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1 to 200. A value outside the range is refused rather than
          clamped, because a clamped short page is indistinguishable from a genuine last page.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        description: 'Cursor: the `id` of the last item the caller saw. An unknown cursor
          is refused rather than restarting from the beginning.'
        schema:
          type: string
      responses:
        '200':
          description: A page of captures.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}/webhooks:
    post:
      tags:
      - Webhooks
      operationId: createWebhook
      summary: Register a delivery target.
      description: |
        `secret` is write-only and is never returned. Deliveries are signed with it in X-CogniGate-Signature, so a receiver can tell a genuine delivery from anything else that finds the URL.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - events
              properties:
                url:
                  type: string
                  format: uri
                secret:
                  type: string
                  description: HMAC key. Never returned.
                events:
                  type: array
                  description: Event types to subscribe to; `GET /admin/v1/meta` lists them
                    all.
                  items:
                    type: string
                enabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Created.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
      - Webhooks
      operationId: listWebhooks
      summary: List a tenant's webhooks.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1 to 200. A value outside the range is refused rather than
          clamped, because a clamped short page is indistinguishable from a genuine last page.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        description: 'Cursor: the `id` of the last item the caller saw. An unknown cursor
          is refused rather than restarting from the beginning.'
        schema:
          type: string
      responses:
        '200':
          description: A page of webhooks.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}/webhooks/{id}:
    delete:
      tags:
      - Webhooks
      operationId: deleteWebhook
      summary: Remove a delivery target.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Webhook id.
        schema:
          type: string
      responses:
        '204':
          description: Removed.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}/events:
    get:
      tags:
      - Webhooks
      operationId: listEvents
      summary: Poll a tenant's event history.
      description: |
        Independent of delivery, which is the point: a tenant with no webhook registered, or one whose endpoint was down for the five attempts a delivery gets, still has to be able to find out that its breaker opened. Polling is the floor under at-least-once delivery, not an alternative to it — the field names match the webhook envelope's exactly so the two can be compared.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1 to 200. A value outside the range is refused rather than
          clamped, because a clamped short page is indistinguishable from a genuine last page.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        description: 'Cursor: the `id` of the last item the caller saw. An unknown cursor
          is refused rather than restarting from the beginning.'
        schema:
          type: string
      responses:
        '200':
          description: A page of events, newest first.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}/usage:
    get:
      tags:
      - Usage
      operationId: getTenantUsage
      summary: Usage and quota state for one tenant.
      description: |
        The admin-plane view of `GET /v1/usage`, for an operator who holds no data key for the tenant.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      - name: window
        in: query
        description: The period to report over.
        schema:
          type: string
          enum:
          - day
          - month
          default: day
      responses:
        '200':
          description: Totals and every quota slot that applies.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/v1/tenants/{tenant}/usage/breakdown:
    get:
      tags:
      - Usage
      operationId: getTenantUsageBreakdown
      summary: Usage for one tenant, broken down by one dimension.
      security:
      - AdminKey: []
      parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant id. A root key reaches any tenant; a `tenant:<id>` key reaches
          only its own, and naming another is a 404.
        schema:
          type: string
      - name: window
        in: query
        description: The period to report over.
        schema:
          type: string
          enum:
          - day
          - month
          default: day
      - name: group_by
        in: query
        description: The dimension to aggregate on.
        schema:
          type: string
          enum:
          - model
          - provider
          - key
          - client_request_id
          default: model
      responses:
        '200':
          description: The breakdown.
          headers:
            X-CogniGate-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageBreakdown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    DataKey:
      type: http
      scheme: bearer
      description: |
        A data-plane key, prefixed `cg-`. Valid on `/v1/*` only. The prefix is part of the credential rather than decoration: it is how the gateway answers "wrong plane" without a store lookup, and how secret scanners recognise a leaked CogniGate key in a public repository.
    AdminKey:
      type: http
      scheme: bearer
      description: |
        An admin-plane key, prefixed `cga-`, or the deployment's bootstrap key. Valid on `/admin/v1/*` only. Scope is either `root`, which reaches every tenant, or `tenant:<id>`, which reaches one.
  headers:
    RequestId:
      description: |
        The identifier that ties this response to its structured log line, its usage record and, on a failure, the `request_id` in the error body. It is the one string a user can quote about a request.
      schema:
        type: string
    ServedBy:
      description: The provider and model that actually served the request.
      schema:
        type: string
    FallbackDepth:
      description: |
        How many candidates the routing cascade tried before one answered. `0` means the first choice served it.
      schema:
        type: integer
    QuotaState:
      description: |
        Where the caller stands against its GW-4 quotas after this request. `soft-exceeded` is the warning that arrives while requests are still being served.
      schema:
        type: string
        enum:
        - ok
        - soft-exceeded
        - hard-exceeded
    Cache:
      description: The GW-12 disposition of this request.
      schema:
        type: string
        enum:
        - hit
        - miss
        - bypass
    DebugCapture:
      description: Present when this request's bodies were retained under the tenant's GW-14
        capture policy.
      schema:
        type: string
    Deprecation:
      description: |
        Present when the model that served this request is marked deprecated in the catalog. GW-9 makes removing a documented header a MAJOR change, so a client may rely on this appearing.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    BadRequest:
      description: The request is malformed, or a parameter is outside the range the deployment
        accepts.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No credential, an unknown one, or one minted for the other plane (`wrong_plane`).
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential is valid but its scope does not reach this resource.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource. A tenant-scoped key naming another tenant also gets this,
        rather than a 403, so the response does not reveal whether that tenant exists.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The write collides with something that already exists.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The body is larger than `max_request_bytes` for this tenant.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited, at the concurrency ceiling, or over a hard quota. `code`
        says which.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-CogniGate-Quota-State:
          $ref: '#/components/headers/QuotaState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Every candidate in the routing cascade failed. On `upstream_exhausted`
        the body enumerates them in `attempts`.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The process is draining, or a dependency it needs is unreachable.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: The upstream did not answer within `request_timeout_seconds`, or a stream
        went idle for longer than `stream_idle_timeout_seconds`.
      headers:
        X-CogniGate-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          - type
          - code
          - param
          properties:
            message:
              type: string
              description: Human-readable explanation. Never contains prompt or completion
                content.
            type:
              type: string
              description: OpenAI's error family, reused so an existing SDK branches on it
                unchanged.
              enum:
              - invalid_request_error
              - authentication_error
              - rate_limit_error
              - api_error
            code:
              type: string
              description: The closed CogniGate code registry. A client that branches on anything
                should branch on this.
              enum:
              - invalid_api_key
              - wrong_plane
              - invalid_request
              - fallback_duplicate_model
              - capture_ttl_too_long
              - unsupported_parameter
              - insufficient_scope
              - model_not_found
              - alias_unresolvable
              - not_supported
              - resource_not_found
              - alias_collides_with_model
              - conflict
              - request_too_large
              - rate_limited
              - concurrency_exceeded
              - quota_exceeded
              - budget_exceeded
              - upstream_exhausted
              - response_too_large
              - upstream_error
              - service_unavailable
              - gateway_timeout
              - upstream_stream_stalled
            param:
              type:
              - string
              - 'null'
              description: The offending field, or null when the failure is not attributable
                to one. Null rather than omitted, because OpenAI clients expect the key to
                be present.
            request_id:
              type: string
              description: Echoes X-CogniGate-Request-Id.
            attempts:
              type: array
              description: 'Present on `upstream_exhausted` only (GW-3.AC-5): the cascade
                as it was tried, in order.'
              items:
                $ref: '#/components/schemas/Attempt'
      description: |
        The GW-7 error envelope. Every failure on either plane leaves the gateway in this shape, so stock OpenAI error handling parses a CogniGate error without a special case.
    Attempt:
      type: object
      required:
      - provider
      - model
      - failure
      properties:
        provider:
          type: string
        model:
          type: string
        failure:
          type: string
          description: Classification of why this candidate failed, from a closed vocabulary.
            Never the upstream's own message.
        status:
          type: integer
          description: The upstream's HTTP status; absent when there was never a response
            to take one from.
    ChatRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: A model id, an alias, or a routing-rule match. Resolved per tenant
            (GW-1, GW-2, GW-3).
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          description: 'When true the response is `text/event-stream`. Strictly boolean: `1`
            is refused.'
      additionalProperties: true
      description: |
        The OpenAI chat-completions request. Only the fields the gateway itself reads are described; everything else is forwarded to the provider untouched, which is what keeps an existing SDK working against this endpoint.
    ChatMessage:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type: string
      additionalProperties: true
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
          description: The model that actually served the request, which is not necessarily
            the one asked for — see X-CogniGate-Fallback-Depth.
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/Usage'
      additionalProperties: true
      description: |
        The provider's response, forwarded. The gateway does not rewrite the body; what it adds is carried in the X-CogniGate-* headers.
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
      additionalProperties: true
    ModelObject:
      type: object
      required:
      - id
      - object
      - created
      - owned_by
      - cognigate
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
        owned_by:
          type: string
        cognigate:
          $ref: '#/components/schemas/ModelExtensions'
      description: |
        One catalog entry in OpenAI's `model` shape, with everything CogniGate knows beyond that namespaced under `cognigate` so a client parsing the OpenAI fields is unaffected by it.
    ModelExtensions:
      type: object
      properties:
        provider:
          type: string
        context_window:
          type: integer
        max_output_tokens:
          type: integer
        capabilities:
          type: array
          items:
            type: string
        input_cost_per_mtok:
          type: number
        output_cost_per_mtok:
          type: number
        deprecated:
          type: boolean
        discovered_at:
          type: string
          format: date-time
        alias:
          type: boolean
          description: True when this entry is an alias rather than a provider-discovered
            model.
        resolves_to:
          type: string
          description: For an alias, the model id it currently selects.
    ModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelObject'
    UsageLimit:
      type: object
      required:
      - scope
      - window
      - unit
      - cap
      - soft_threshold_pct
      - consumed
      - remaining
      - resets_at
      - state
      properties:
        scope:
          type: string
          enum:
          - tenant
          - key
        window:
          type: string
          enum:
          - day
          - month
        unit:
          type: string
          enum:
          - tokens
          - cost
        cap:
          type: number
        soft_threshold_pct:
          type: integer
        consumed:
          type: number
        remaining:
          type: number
        resets_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - ok
          - soft-exceeded
          - hard-exceeded
    UsageResponse:
      type: object
      required:
      - object
      - window
      - since
      - until
      - state
      - limits
      - requests
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - cost_usd
      properties:
        object:
          type: string
          const: usage
        window:
          type: string
          enum:
          - day
          - month
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        requests:
          type: integer
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cost_usd:
          type: number
        state:
          type: string
          description: The worst state across `limits`.
          enum:
          - ok
          - soft-exceeded
          - hard-exceeded
        limits:
          type: array
          description: Every quota slot that applies, tenant and key alike. Empty when nothing
            is capped.
          items:
            $ref: '#/components/schemas/UsageLimit'
    UsageBucket:
      type: object
      required:
      - key
      - requests
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - cost_usd
      properties:
        key:
          type: string
          description: The value of the grouping dimension for this row.
        requests:
          type: integer
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cost_usd:
          type: number
    UsageBreakdown:
      type: object
      required:
      - object
      - window
      - group_by
      - since
      - until
      - data
      - truncated
      properties:
        object:
          type: string
          const: usage_breakdown
        window:
          type: string
          enum:
          - day
          - month
        group_by:
          type: string
          enum:
          - model
          - provider
          - key
          - client_request_id
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        data:
          type: array
          description: Ordered by spend, descending.
          items:
            $ref: '#/components/schemas/UsageBucket'
        truncated:
          type: boolean
          description: True when there were more than 200 buckets and the cheapest were dropped.
    HealthReport:
      type: object
      required:
      - status
      - gateway
      - store
      - catalog
      - providers
      - aliases
      - rules
      - quota
      - checked_at
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        gateway:
          type: object
          required:
          - version
          - uptime_seconds
          properties:
            version:
              type: string
            uptime_seconds:
              type: integer
        store:
          $ref: '#/components/schemas/ComponentHealth'
        catalog:
          $ref: '#/components/schemas/CatalogHealth'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderHealth'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/NameState'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/NameState'
        quota:
          type: object
          required:
          - state
          properties:
            state:
              type: string
              enum:
              - ok
              - soft-exceeded
              - hard-exceeded
        checked_at:
          type: string
          format: date-time
      description: |
        The GW-5 view: what this deployment can currently reach, how fresh what it knows is, and which of the tenant's configured names still resolve.
    ComponentHealth:
      type: object
      required:
      - kind
      - reachable
      properties:
        kind:
          type: string
        reachable:
          type: boolean
        error:
          type: string
    CatalogHealth:
      type: object
      required:
      - models
      - age_seconds
      - state
      - stale
      properties:
        models:
          type: integer
        age_seconds:
          type: integer
        state:
          type: string
          enum:
          - fresh
          - stale
        stale:
          type: boolean
        fetched_at:
          type: string
          format: date-time
    ProviderHealth:
      type: object
      required:
      - provider
      - enabled
      - models
      - breaker
      - catalog
      properties:
        provider:
          type: string
        enabled:
          type: boolean
        models:
          type: integer
        breaker:
          type: string
          enum:
          - closed
          - open
          - half-open
        breaker_until:
          type: string
          format: date-time
        breakers:
          type: array
          description: Per-model breakers, present only for the models whose own breaker is
            not closed.
          items:
            type: object
            required:
            - model
            - breaker
            properties:
              model:
                type: string
              breaker:
                type: string
                enum:
                - open
                - half-open
              breaker_until:
                type: string
                format: date-time
        catalog:
          type: object
          required:
          - age_seconds
          - state
          properties:
            age_seconds:
              type: integer
            state:
              type: string
              enum:
              - fresh
              - stale
        error:
          type: string
    NameState:
      type: object
      required:
      - name
      - state
      properties:
        name:
          type: string
          description: The alias name, or the routing rule's match pattern.
        state:
          type: string
          enum:
          - ok
          - degraded
        resolves_to:
          type: string
          description: What a request naming this would be served by today. Absent when nothing
            resolves.
        reason:
          type: string
          description: Why it is degraded. Absent while it is serving.
      description: An alias or routing rule and whether it still resolves.
    Meta:
      type: object
      required:
      - name
      - version
      - api_version
      - capabilities
      - endpoints
      - limits
      - object
      - mode
      - store
      - planes
      - features
      properties:
        name:
          type: string
        version:
          type: string
          description: Semver. GW-9 makes this a value a client may parse.
        api_version:
          type: string
          description: The major the URL prefixes carry.
          const: v1
        capabilities:
          type: array
          items:
            type: string
        endpoints:
          type: array
          description: The data-plane paths this deployment serves.
          items:
            type: string
        limits:
          $ref: '#/components/schemas/MetaLimits'
        object:
          type: string
          const: meta
        mode:
          type: string
          enum:
          - dev
          - server
        store:
          type: string
        planes:
          type: object
          additionalProperties:
            type: string
          description: Plane name to URL prefix.
        features:
          type: object
          additionalProperties:
            type: boolean
          description: Optional behaviour and whether this deployment has it on. GW-9 makes
            this the supported way to feature-detect.
    MetaLimits:
      type: object
      properties:
        max_request_bytes:
          type: integer
        max_response_bytes:
          type: integer
        request_timeout_seconds:
          type: integer
        stream_idle_timeout_seconds:
          type: integer
        max_concurrent_per_key:
          type: integer
        max_fallback_depth:
          type: integer
        requests_per_second:
          type: integer
        burst_capacity:
          type: integer
    AdminMeta:
      type: object
      required:
      - scope
      - events
      properties:
        scope:
          type: string
          description: '`root`, or `tenant:<id>` for a tenant-scoped key.'
        events:
          type: array
          description: Every event type a webhook may subscribe to.
          items:
            type: string
      additionalProperties: true
    TenantLimits:
      type: object
      properties:
        max_request_bytes:
          type: integer
        request_timeout_seconds:
          type: integer
        stream_idle_timeout_seconds:
          type: integer
        max_concurrent_per_key:
          type: integer
        requests_per_second:
          type: integer
        burst_capacity:
          type: integer
      description: |
        Per-tenant ceilings (GW-13). Each may only lower the deployment's own figure, never raise it, and a value above it is refused. An omitted or zero field means the deployment's value.
    TenantCache:
      type: object
      properties:
        enabled:
          type: boolean
          description: Opts every eligible request into the GW-12 cache without the caller
            sending a header.
        ttl_seconds:
          type: integer
          description: Zero means the deployment's default, not zero seconds. A value above
            `cache.max_ttl` is refused.
    TenantDebugCapture:
      type: object
      properties:
        enabled:
          type: boolean
        ttl_seconds:
          type: integer
          description: Zero means the deployment's default.
        sample_rate:
          type: number
          description: Zero means the deployment's default, not "capture nothing" — `enabled`
            is the switch.
      description: |
        GW-14's one exception to the content ban. While this is on, a sampled fraction of the tenant's requests have their bodies retained, readable through the admin plane alone, until they are hard-deleted at `ttl_seconds`. There is deliberately no deployment-wide switch: turning retention on has to name whose content is being retained.
    Tenant:
      type: object
      required:
      - id
      - name
      - status
      - created_at
      - limits
      - cache
      - debug_capture
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
        created_at:
          type: string
          format: date-time
        limits:
          $ref: '#/components/schemas/TenantLimits'
        cache:
          $ref: '#/components/schemas/TenantCache'
        debug_capture:
          $ref: '#/components/schemas/TenantDebugCapture'
    APIKey:
      type: object
      required:
      - id
      - tenant_id
      - plane
      - name
      - prefix
      - created_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
          description: Empty for a root admin key, which belongs to no tenant.
        plane:
          type: string
          enum:
          - data
          - admin
        name:
          type: string
        prefix:
          type: string
          description: The display prefix, which is also what usage records and audit entries
            attribute to.
        scope:
          type: string
          description: 'Admin keys only: `root`, or `tenant:<id>`.'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      description: |
        A key as stored. The secret is never here — only a hash is kept, so a stolen database yields no working credential.
    MintedKey:
      type: object
      required:
      - key
      - secret
      - warning
      properties:
        key:
          $ref: '#/components/schemas/APIKey'
        secret:
          type: string
          description: 'The plaintext credential. Send it as `Authorization: Bearer <secret>`.'
        warning:
          type: string
      description: |
        The show-once response from both key-creation routes. `secret` is returned exactly here and nowhere else; the stored record is nested under `key`.
    Provider:
      type: object
      required:
      - id
      - tenant_id
      - name
      - kind
      - base_url
      - enabled
      - key_prefixes
      - created_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
          description: The routing identifier — `openai`, `anthropic`, …
        kind:
          type: string
          description: Which adapter to use. `openai` covers every OpenAI-compatible API.
        base_url:
          type: string
          format: uri
        enabled:
          type: boolean
        key_prefixes:
          type: array
          description: Display prefixes for the registered credentials. The credentials themselves
            are never returned.
          items:
            type: string
        created_at:
          type: string
          format: date-time
    Alias:
      type: object
      required:
      - id
      - tenant_id
      - name
      - created_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        pin:
          type: string
          description: A model id this alias always resolves to. A pin wins outright; the
            constraint fields below are then unused.
        capabilities:
          type: array
          items:
            type: string
        min_context_window:
          type: integer
        provider_preference:
          type: array
          items:
            type: string
        cost_tier:
          type: string
          enum:
          - cheapest
          - balanced
          - best
        created_at:
          type: string
          format: date-time
      description: |
        A stable name a caller may use in place of a real model id (GW-2). Without a pin the constraint fields select the best current catalog entry, so "fast" keeps meaning fast as providers ship new models.
    RoutingRule:
      type: object
      required:
      - id
      - tenant_id
      - match
      - chain
      - created_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        match:
          type: string
          description: The model or alias the caller asks for.
        chain:
          type: array
          description: Tried left to right (GW-3). A single-element chain is a pin with no
            fallback, which is a legitimate configuration.
          items:
            type: string
        created_at:
          type: string
          format: date-time
    QuotaLimit:
      type: object
      required:
      - cap
      - soft_threshold_pct
      properties:
        cap:
          type: number
        soft_threshold_pct:
          type: integer
          description: The percentage of `cap` at which the holder is warned, via X-CogniGate-Quota-State
            and a webhook event.
    QuotaWindow:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/QuotaLimit'
        cost:
          $ref: '#/components/schemas/QuotaLimit'
      description: Either may be absent, so a tenant can be capped on spend without also being
        capped on tokens.
    Quota:
      type: object
      required:
      - tenant_id
      - day
      - month
      - updated_at
      properties:
        tenant_id:
          type: string
        key_id:
          type: string
          description: Present when this quota constrains one key rather than the tenant.
        day:
          $ref: '#/components/schemas/QuotaWindow'
        month:
          $ref: '#/components/schemas/QuotaWindow'
        updated_at:
          type: string
          format: date-time
      description: |
        Four independent slots (GW-4): two windows in two units. An absent slot is unlimited, which is distinct from a cap of zero. A key-level quota can only narrow what the tenant's own quota already allows — both are evaluated and either may reject.
    Webhook:
      type: object
      required:
      - id
      - tenant_id
      - url
      - events
      - enabled
      - created_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          description: Subscribed event types. `GET /admin/v1/meta` lists everything available.
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
      description: |
        A delivery target. The HMAC secret is write-only: it is accepted on create and never returned. Deliveries carry it as X-CogniGate-Signature.
    Event:
      type: object
      required:
      - id
      - type
      - created
      - tenant
      - data
      properties:
        id:
          type: string
        type:
          type: string
        created:
          type: string
          format: date-time
        tenant:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Gateway facts — a model id, a provider name, a quota window. Never
            request or response content (GW-14).
      description: |
        One notification as it was published. The field names match the webhook envelope's exactly, so a reader can compare what it polled against what it was delivered.
    AuditEntry:
      type: object
      required:
      - id
      - at
      - actor
      - actor_key_id
      - actor_scope
      - action
      - resource
      - status
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: The credential's display prefix, which is what an operator sees when
            listing keys.
        actor_key_id:
          type: string
        actor_scope:
          type: string
        action:
          type: string
          enum:
          - create
          - update
          - upsert
          - delete
        resource:
          type: string
        tenant_id:
          type: string
        status:
          type: integer
          description: The HTTP status the attempt produced. Refused writes are logged too
            — an attempt to reach another tenant is exactly what this log is read to find.
        request_id:
          type: string
      description: |
        One line of the append-only admin log (GW-6). It records who did what to which resource and how it ended, never the request body: an admin write can carry provider credentials, and a log that captured them would hand an auditor a second copy of every secret.
    Capture:
      type: object
      required:
      - id
      - at
      - expires_at
      - status
      - request
      - response
      properties:
        id:
          type: string
        request_id:
          type: string
        at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        model:
          type: string
        status:
          type: integer
        request:
          type: string
          description: The request body as captured, base64-encoded.
          format: byte
        response:
          type: string
          description: The response body as captured, base64-encoded.
          format: byte
      description: |
        The one place in the product where prompt content is served back out (GW-14). Read-only, admin plane, tenant-scoped, and only for a tenant whose `debug_capture` was explicitly enabled by an admin action that is itself in the audit log.
    CatalogRefreshResult:
      type: object
      required:
      - object
      - refreshed
      properties:
        object:
          type: string
          const: catalog_refresh
        refreshed:
          type: array
          description: One row per tenant. A provider that could not be reached is reported
            here rather than failing the whole call, so refreshing ten tenants does not hide
            nine results behind the first failure.
          items:
            type: object
            required:
            - tenant
            properties:
              tenant:
                type: string
              ok:
                type: boolean
              models:
                type: integer
              stale:
                type: boolean
              error:
                type: string
              errors:
                type: array
                items:
                  type: string
    TenantList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of tenants.
    APIKeyList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of keys.
    ProviderList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of providers.
    AliasList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Alias'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of aliases.
    RoutingRuleList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of routing rules.
    WebhookList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of webhooks.
    EventList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of events, newest first.
    AuditList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of audit entries, newest first.
    CaptureList:
      type: object
      required:
      - object
      - data
      - has_more
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Capture'
        has_more:
          type: boolean
          description: True when a further page exists; pass the last item's `id` as `?after=`
            to fetch it.
      description: A page of captures, newest first.

# This file documents all configurable parameters for a self-hosted CogniGate
# deployment. Values here are used as documentation/defaults.
# Actual runtime values are loaded from environment variables (see .env.example).
# =============================================================================

cognigate:
  version: "0.1.0"
  environment: "development"  # development | production

  # =====================================================
  # Gateway (Go Edge Proxy) Configuration
  # =====================================================
  gateway:
    port: 8080
    # Redis connection address (host:port)
    redis_url: "redis:6379"
    # Local in-memory cache TTL when Redis is unreachable (circuit breaker mode)
    fallback_cache_ttl_seconds: 300
    # Rate limiting defaults per tenant (can be overridden per-tenant)
    rate_limit:
      requests_per_second: 50
      burst_capacity: 100

  # =====================================================
  # Analytics (Spring Boot Domain Engine) Configuration
  # =====================================================
  analytics:
    port: 8081
    datasource:
      url: "jdbc:postgresql://postgres-db:5432/cognigate"
      username: "cognigate_user"
      password: "cognigate_pass"  # Use SPRING_DATASOURCE_PASSWORD env var in production
    jpa:
      ddl_auto: "update"           # update | validate | create | create-drop
      show_sql: false
    threads:
      virtual_enabled: true        # Enable Java 25 Project Loom Virtual Threads
    encryption:
      # 32-byte hex key for AES-256-GCM provider key vault
      # Set via ENCRYPTION_MASTER_KEY env var. Never store plaintext here.
      master_key_env: "ENCRYPTION_MASTER_KEY"

  # =====================================================
  # PostgreSQL Configuration
  # =====================================================
  postgres:
    image: "postgres:16-alpine"
    port: 5432
    database: "cognigate"
    username: "cognigate_user"
    data_volume: "pgdata"

  # =====================================================
  # Redis Configuration
  # =====================================================
  redis:
    image: "redis:7-alpine"
    port: 6379
    invalidation_channel: "cognigate:cache:invalidate"
    tenant_key_prefix: "tenant:cfg:"

  # =====================================================
  # Billing Configuration
  # =====================================================
  billing:
    # Cost per 1,000 tokens in USD
    cost_per_thousand_tokens: 0.0015
    # Cron expression for monthly invoice generation (midnight, 1st of each month)
    cron_schedule: "0 0 0 1 * ?"

  # =====================================================
  # Plugin Engine Configuration
  # =====================================================
  plugins:
    # Tier 1: JSON-configurable endpoints (OpenAI-compatible)
    json_mapper:
      enabled: true
    # Tier 2: Dynamic Java bytecode compilation via Janino
    dynamic_compiler:
      enabled: true
      compiler: "janino"
      compiler_version: "3.1.12"

  # =====================================================
  # GitHub Pages / Docs Site
  # =====================================================
  docs:
    base_url: "https://life-experimentalist.github.io/CogniGate"
    github_repo: "https://github.com/Life-Experimentalist/CogniGate"

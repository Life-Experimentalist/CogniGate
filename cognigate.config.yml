# CogniGate — gateway configuration
# Copyright 2026 VKrishna04 and Life Experimentalist
# Licensed under Apache 2.0
#
# This is the file the gateway reads when started with `--config`. Every key
# below is optional and every value shown is the built-in default, so a file
# that sets nothing behaves exactly like no file at all. Pass it explicitly:
#
#     cognigate --config cognigate.config.yml
#
# Environment variables are applied after this file and win over it. Each one
# is read under two spellings, CG_<NAME> and <NAME>, so a deployment can
# namespace them or not: CG_PORT, CG_ADMIN_BOOTSTRAP_KEY, CG_TLS_CERT_FILE,
# CG_TLS_KEY_FILE, CG_ANALYTICS_URL, CG_ANALYTICS_TOKEN, CG_METRICS_TOKEN,
# CG_LOG_LEVEL, CG_QUOTA_ENFORCEMENT, CG_CACHE_ENABLED.
#
# Secrets belong in the environment, not here. A credential written into this
# file is a credential in version control.
#
# The analytics service is a separate process and is not configured from this
# file — it reads standard Spring properties (SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, ANALYTICS_TOKEN).
# See .env.example and docker-compose.yml.
# =============================================================================

gateway:
  port: 8080
  # Both planes are served by one listener, so this pair turns the whole
  # process to HTTPS. Set both or neither; half of a pair fails at startup.
  tls_cert_file: ""
  tls_key_file: ""

admin:
  # The one credential that exists before any tenant does. There is no default
  # and no fallback, because a built-in value would be public knowledge. Left
  # empty the gateway still starts, but nothing can reach the admin plane until
  # a key is configured — and a value shorter than 16 characters is refused
  # outright rather than allowed to become the deployment's admin password.
  # Set CG_ADMIN_BOOTSTRAP_KEY.
  bootstrap_key: ""

# Where usage records are shipped. Leave base_url empty to run without an
# analytics backend — usage is then held in memory and lost on restart.
analytics:
  base_url: ""
  token: ""
  timeout: 10s

# Model catalogues are refreshed from each provider and cached.
catalog:
  ttl: 1h
  stale_warn_after: 6h
  provider_timeout: 10s

routing:
  # How many providers a single request may fall through before giving up.
  max_fallback_depth: 5
  breaker:
    error_threshold: 5
    window: 30s
    open_duration: 60s

quotas:
  default_soft_threshold_pct: 80
  # "on" rejects past a hard cap; "observe" only emits events and headers,
  # which is how to size quotas before turning them into rejections.
  enforcement: "on"

limits:
  max_request_bytes: 2097152      # 2 MiB
  max_response_bytes: 8388608     # 8 MiB
  request_timeout: 120s
  upstream_connect_timeout: 10s
  stream_idle_timeout: 60s
  max_concurrent_per_key: 32

# Per-tenant defaults; a tenant may be given its own.
#
# Raising this past what the analytics service can ingest costs usage records,
# not throughput: metering is an asynchronous bounded queue (see telemetry.buffer
# below), and once it is full the gateway keeps serving and drops the record. It
# says so on the cognigate_telemetry_dropped counter and in a throttled warning
# log. Quotas are measured from those same records, so a deployment that meters
# slower than it serves under-counts consumption as well as under-reporting it.
rate_limit:
  requests_per_second: 50
  burst_capacity: 100

# Response caching is off by default: an identical prompt returning a stored
# answer is the right behaviour only where the caller expects it.
cache:
  enabled: false
  default_ttl: 5m
  max_ttl: 24h
  max_entry_bytes: 262144         # 256 KiB — the largest response worth storing
  max_bytes: 67108864             # 64 MiB — the cache as a whole

webhooks:
  max_attempts: 5
  timeout: 10s

telemetry:
  # Usage records held while the analytics service is behind. It absorbs an
  # outage and a burst alike: the queue drains one record at a time, so this
  # bounds how long the gateway can out-run its metering, not how fast it can
  # meter. A full queue drops the record rather than the request.
  buffer: 1000

health:
  cache_ttl: 2s

metrics:
  enabled: true
  path: "/metrics"
  # Empty leaves /metrics unauthenticated, which is what a Prometheus scrape
  # on a private network expects. Set CG_METRICS_TOKEN to require a bearer.
  token: ""

shutdown:
  # How long in-flight requests are given after the process is asked to stop.
  # /healthz starts failing immediately so traffic is steered away first.
  drain_timeout: 30s

log:
  level: "info"                   # debug | info | warn | error

# Debug capture stores prompt and completion content for a tenant that has
# turned it on. max_capture_ttl may be lowered but never raised above 72h.
debug:
  max_capture_ttl: 72h
  default_capture_ttl: 24h
  default_sample_rate: 0.01
  max_capture_bytes_per_tenant: 33554432   # 32 MiB
  capture_sweep_interval: 1m

name: "Docker Hub: Descriptions"

# Keeps the Docker Hub repository pages in step with .github/dockerhub/.
# Separate from docker-publish.yml so that editing a description does not
# rebuild two multi-arch images, and gated on the same variable, so a fork
# without Docker Hub configured skips it.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/dockerhub/**"
      - ".github/workflows/dockerhub-description.yml"
  workflow_dispatch:

jobs:
  sync:
    if: vars.DOCKERHUB_NAMESPACE != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: cognigate-gateway
            short: "CogniGate gateway: self-hosted, multi-tenant, OpenAI-compatible LLM gateway."
          - repo: cognigate-analytics
            short: "CogniGate analytics: usage and billing service for the CogniGate LLM gateway."
          - repo: cognigate
            short: "Self-hosted, multi-tenant LLM gateway. Images: cognigate-gateway, cognigate-analytics."
    steps:
      - uses: actions/checkout@v7

      - name: Update ${{ matrix.repo }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.repo }}
          short-description: ${{ matrix.short }}
          readme-filepath: .github/dockerhub/${{ matrix.repo }}.md

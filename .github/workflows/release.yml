name: Release — Create GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25 for build artifact
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Go 1.26 for build artifact
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build Analytics Fat-JAR
        working-directory: analytics
        run: mvn -B package -DskipTests

      - name: Build Gateway binary (linux-amd64)
        working-directory: gateway
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cognigate-gateway-linux-amd64 .

      - name: Build Gateway binary (linux-arm64)
        working-directory: gateway
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cognigate-gateway-linux-arm64 .

      - name: Build Gateway binary (darwin-amd64)
        working-directory: gateway
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cognigate-gateway-darwin-amd64 .

      - name: Build Gateway binary (darwin-arm64)
        working-directory: gateway
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cognigate-gateway-darwin-arm64 .

      - name: Build Gateway binary (windows-amd64)
        working-directory: gateway
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cognigate-gateway-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            analytics/target/analytics-*.jar
            gateway/cognigate-gateway-linux-amd64
            gateway/cognigate-gateway-linux-arm64
            gateway/cognigate-gateway-darwin-amd64
            gateway/cognigate-gateway-darwin-arm64
            gateway/cognigate-gateway-windows-amd64.exe
            docker-compose.yml
            .env.example

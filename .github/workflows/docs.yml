name: Docs — Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Where the export believes it will be served from. A static export has
      # to bake absolute URLs into sitemap.xml, robots.txt and the OpenGraph
      # tags at build time, and it has no request to read a Host header from,
      # so these two are the only place the public address is written down.
      #
      # Moving to the custom domain is these two lines and a docs/public/CNAME
      # file, in one push, once the DNS record resolves: SITE_ORIGIN becomes
      # https://cognigate.vkrishna04.me and BASE_PATH becomes empty, because a
      # custom domain serves from the root rather than from /CogniGate.
      # Changing either one early breaks every asset path on the live site.
      - name: Build Next.js static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /CogniGate
          NEXT_PUBLIC_SITE_ORIGIN: https://life-experimentalist.github.io

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

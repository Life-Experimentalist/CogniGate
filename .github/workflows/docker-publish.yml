name: Docker — Build & Publish to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  GATEWAY_IMAGE: ghcr.io/life-experimentalist/cognigate-gateway
  ANALYTICS_IMAGE: ghcr.io/life-experimentalist/cognigate-analytics

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The builder stages cross-compile, but each runtime stage still runs its
      # own RUN lines on the target platform, so emulation is needed for arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # Pinned, and newer than the action's default. The default QEMU
          # segfaults running glibc's ldconfig, which is a postinst script every
          # apt install on the arm64 analytics image triggers -- the build failed
          # on `apt-get install curl` with SIGSEGV in libc-bin, not on anything
          # this repository wrote.
          image: tonistiigi/binfmt:qemu-v9.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----- Gateway -----
      - name: Extract metadata — Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push — Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          # The tag, without its leading v, so a released image reports a real
          # version at /v1/meta instead of the Dockerfile's 0.0.0-dev default.
          # On a branch push metadata-action's version output is the literal
          # string 'main', which no semver parser accepts, so the default is
          # kept there on purpose -- an honest dev marker beats an unparseable one.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta-gateway.outputs.version || '0.0.0-dev' }}
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Analytics -----
      - name: Extract metadata — Analytics
        id: meta-analytics
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ANALYTICS_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push — Analytics
        uses: docker/build-push-action@v5
        with:
          context: ./analytics
          file: ./analytics/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-analytics.outputs.tags }}
          labels: ${{ steps.meta-analytics.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

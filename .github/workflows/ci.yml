name: CI — Build & Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Read-only, for all five jobs. Nothing here publishes anything: the jobs
# check out, build, test and stand up a compose stack, and the artifact
# uploads use the Actions runtime token rather than this one. Declared
# because the default is whatever the repository's Actions settings say,
# which is a property of a settings page rather than of this file, and can
# be widened without any change here to notice.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Java — Spring Boot Analytics Engine
  # ============================================================
  build-analytics:
    name: Analytics (Java 25 / Spring Boot 4.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven (skip tests)
        run: mvn -B package -DskipTests

      - name: Run Unit Tests
        run: mvn -B test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-test-reports
          path: analytics/target/surefire-reports/

  # ============================================================
  # Go — Edge Proxy Gateway
  # ============================================================
  build-gateway:
    name: Gateway (Go 1.26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build static binary
        run: CGO_ENABLED=0 GOOS=linux go build -o gateway .

  # ============================================================
  # Docker Compose — Integration Smoke Test
  # ============================================================
  integration-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [build-analytics, build-gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          sed -i "s|^GATEWAY_BOOTSTRAP_KEY=.*|GATEWAY_BOOTSTRAP_KEY=$(openssl rand -hex 24)|" .env
          sed -i "s|^ANALYTICS_TOKEN=.*|ANALYTICS_TOKEN=$(openssl rand -hex 32)|" .env

      # --wait blocks until every service reports healthy, which is the same
      # signal an operator gets. The timeout is above GW-11's 60s budget on
      # purpose: that budget is for a warm image on real hardware, and a cold
      # JVM on a shared runner is not the thing it describes.
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Smoke — the gateway is live
        run: curl -fsS http://localhost:8080/healthz | jq -e '.status == "ok"'

      # There is no upstream provider in this stack — the conformance job adds
      # one through docker-compose.conformance.yml and asserts completions end
      # to end, which is where that coverage lives. What this job can assert
      # without an upstream is that the data plane
      # refuses an unauthenticated caller in the documented envelope — which is
      # a stronger check than the mock response this replaced, because nothing
      # about it can pass unless authentication and error rendering are both
      # really running.
      - name: Smoke — the data plane refuses an unauthenticated request
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' \
            -X POST http://localhost:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-4o","messages":[{"role":"user","content":"hello"}]}')
          if [ "$code" != "401" ]; then
            echo "expected 401, got $code"; cat body.json; exit 1
          fi
          jq -e '.error.code == "invalid_api_key" and (.error.request_id | length) > 0' body.json

      - name: Smoke — bootstrap reaches the admin plane and mints a working key
        run: |
          set -euo pipefail
          BOOTSTRAP=$(grep '^GATEWAY_BOOTSTRAP_KEY=' .env | cut -d= -f2-)

          TENANT=$(curl -fsS -X POST http://localhost:8080/admin/v1/tenants \
            -H "Authorization: Bearer ${BOOTSTRAP}" \
            -H 'Content-Type: application/json' \
            -d '{"name":"smoke"}' | jq -er '.id')

          SECRET=$(curl -fsS -X POST "http://localhost:8080/admin/v1/tenants/${TENANT}/keys" \
            -H "Authorization: Bearer ${BOOTSTRAP}" \
            -H 'Content-Type: application/json' \
            -d '{"name":"smoke","plane":"data"}' | jq -er '.secret')

          # The freshly minted key must open the data plane it was issued for.
          curl -fsS http://localhost:8080/v1/models \
            -H "Authorization: Bearer ${SECRET}" | jq -e '.object == "list"'

          # And must not open the other one.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/v1/tenants \
            -H "Authorization: Bearer ${SECRET}")
          if [ "$code" != "401" ]; then
            echo "a data key reached the admin plane: ${code}"; exit 1
          fi

          # An OpenAI path CogniGate does not implement is an explicit 404,
          # never a silent proxy to whatever an upstream happens to serve
          # (GW-9). This needs the key: without one it is a 401 first.
          code=$(curl -s -o body.json -w '%{http_code}' -X POST http://localhost:8080/v1/embeddings \
            -H "Authorization: Bearer ${SECRET}" \
            -H 'Content-Type: application/json' -d '{}')
          if [ "$code" != "404" ]; then
            echo "expected 404, got ${code}"; cat body.json; exit 1
          fi
          jq -e '.error.code == "not_supported"' body.json

      - name: Smoke — metrics are exposed
        run: curl -fsS http://localhost:8080/metrics | grep -q '^# HELP cognigate_'

      - name: Smoke — analytics is live
        run: curl -fsS http://localhost:8081/actuator/health | jq -e '.status == "UP"'

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ============================================================
  # GW-10 — the conformance suite against the reference deployment
  # ============================================================
  #
  # GW-10 gives this job two duties. It is the suite's own regression test —
  # "CogniGate's own CI MUST run the full suite against a fresh docker-compose
  # deployment on every merge to main" — and it is the evidence behind every
  # capability /v1/meta claims, because a release must not ship with failures in
  # a claimed one.
  #
  # Four of GW-10's six criteria are properties of this job rather than of any
  # assertion inside the suite, and conformance/gw10_test.go asserts that the
  # steps below still exist. Renaming a step is free; deleting one is not.
  conformance:
    name: Conformance (GW-10)
    runs-on: ubuntu-latest
    needs: [build-gateway]

    env:
      # Fixed so the compose network has a name the containerised run can be
      # given. Left to default it would be the checkout directory's name, which
      # is a property of the runner rather than of this repository.
      COMPOSE_PROJECT_NAME: cognigate
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.conformance.yml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Pinned rather than @latest: this produces the JUnit XML GW-10 requires a
      # run to be able to emit, and a test reporter that changes underneath the
      # workflow changes what the evidence looks like without anyone asking.
      #
      # v1.12.0 is not buildable by the Go this job installs. It resolves
      # golang.org/x/tools v0.19.0, whose tokeninternal package sizes an
      # array with a constant that comes out negative under Go 1.26, so the
      # install fails before a single test runs. v1.13.0 resolves v0.36.0.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Create .env from example
        run: |
          cp .env.example .env
          sed -i "s|^GATEWAY_BOOTSTRAP_KEY=.*|GATEWAY_BOOTSTRAP_KEY=$(openssl rand -hex 24)|" .env
          sed -i "s|^ANALYTICS_TOKEN=.*|ANALYTICS_TOKEN=$(openssl rand -hex 32)|" .env

      # The reference deployment plus the two mock upstreams the overlay adds.
      # The whole stack, not just the gateway: the criterion is about what an
      # operator would actually run.
      - name: Build and start the reference deployment
        run: docker compose ${COMPOSE_FILES} up --build -d --wait --wait-timeout 300

      # GW-8.AC-8. The requirement covers both processes, and the analytics
      # engine is a second deployable at an address the suite cannot derive from
      # the gateway's. Exported here rather than per-step so every host pass
      # checks it; the containerised pass deliberately does not inherit it,
      # because that image's contract is three variables and adding a fourth
      # would mean CI exercised something other than what is documented.
      - name: Point the suite at the analytics engine
        run: echo "CONF_ANALYTICS_URL=http://localhost:8081" >> "${GITHUB_ENV}"

      # GW-8.AC-1 and GW-8.AC-2 assert the shape of the gateway's request log,
      # which the suite can only check if it can read one. --no-log-prefix keeps
      # the JSON records intact; compose's usual "gateway  | " prefix would make
      # every line unparseable.
      - name: Follow the gateway's log
        run: |
          nohup docker compose ${COMPOSE_FILES} logs -f --no-color --no-log-prefix gateway \
            > "${GITHUB_WORKSPACE}/gateway.log" 2>&1 &
          echo "CONF_LOG_PATH=${GITHUB_WORKSPACE}/gateway.log" >> "${GITHUB_ENV}"

      # Masked before it is exported: the key is generated for this run and dies
      # with the stack, but every later step inherits it and a masked value is
      # not the thing that ends up in a log the workflow uploads.
      - name: Read the bootstrap credential
        run: |
          KEY=$(grep '^GATEWAY_BOOTSTRAP_KEY=' .env | cut -d= -f2-)
          echo "::add-mask::${KEY}"
          echo "CONF_ADMIN_KEY=${KEY}" >> "${GITHUB_ENV}"

      # GW-10.AC-1. -count=1 because Go caches test results by package and flags,
      # and a rerun whose only change is the deployment's configuration would
      # otherwise report the previous deployment's verdict.
      - name: GW-10.AC-1 — the suite passes against the reference deployment
        env:
          CONF_BASE_URL: http://localhost:8080
          CONF_MOCK_PROVIDER: http://mock-provider-a:9900
          CONF_MOCK_CONTROL_URL: http://localhost:19900
          CONF_REPORT: ${{ github.workspace }}/conformance-report.json
        run: |
          gotestsum --format testname --junitfile conformance-junit.xml \
            -- -count=1 -timeout 25m ./conformance/...

      # GW-10.AC-3. Each run gets a mock of its own: the suite isolates itself on
      # the gateway by naming everything after its run id, but a mock's listing
      # fault and its seed models' call counters are process-global, so two runs
      # sharing one would interfere over something neither of them named.
      # Separate reports for the same reason — one path would leave one run's
      # artefact on disk describing both.
      - name: GW-10.AC-3 — two suite runs pass concurrently
        env:
          CONF_BASE_URL: http://localhost:8080
        run: |
          run_suite() {
            CONF_MOCK_PROVIDER="$2" CONF_MOCK_CONTROL_URL="$3" \
            CONF_REPORT="${GITHUB_WORKSPACE}/conformance-report-$1.json" \
              go test -count=1 -timeout 25m ./conformance/... > "suite-$1.log" 2>&1
          }
          run_suite a http://mock-provider-a:9900 http://localhost:19900 &
          a=$!
          run_suite b http://mock-provider-b:9900 http://localhost:19901 &
          b=$!
          status=0
          wait $a || status=1
          wait $b || status=1
          echo '--- concurrent run a ---'; cat suite-a.log
          echo '--- concurrent run b ---'; cat suite-b.log
          exit $status

      - name: Build the conformance image
        run: docker build -f conformance/Dockerfile --target suite -t cognigate-conformance:ci .

      # GW-10.AC-6. Exactly three -e flags: the image's contract is
      # CONF_BASE_URL, CONF_ADMIN_KEY and CONF_MOCK_PROVIDER, and a fourth here
      # would mean the documented contract is not the one CI exercises. The
      # report directory is world-writable because the image runs unprivileged
      # and the bind mount carries the host's ownership, not the image's.
      - name: GW-10.AC-6 — the image runs from the three documented variables
        run: |
          mkdir -p container-report && chmod 0777 container-report
          docker run --rm \
            --network ${COMPOSE_PROJECT_NAME}_cogni-net \
            -v "${GITHUB_WORKSPACE}/container-report:/work" \
            -e CONF_BASE_URL=http://gateway:8080 \
            -e CONF_ADMIN_KEY="${CONF_ADMIN_KEY}" \
            -e CONF_MOCK_PROVIDER=http://mock-provider-a:9900 \
            cognigate-conformance:ci

          jq -e '.summary.fail == 0 and (.results | length) > 0' \
            container-report/conformance-report.json

      # GW-4.AC-8. Hard caps that only report are a different gateway from hard
      # caps that reject, so this criterion is unreachable from the run above and
      # certifying both modes costs two runs. Recreating just the gateway is
      # enough — enforcement is read at startup, and nothing else in the stack
      # depends on it. Placed after the container run so that one still exercises
      # the enforcing deployment.
      - name: GW-4.AC-8 — the suite passes against a gateway in quota observe mode
        env:
          CONF_BASE_URL: http://localhost:8080
          CONF_MOCK_PROVIDER: http://mock-provider-a:9900
          CONF_MOCK_CONTROL_URL: http://localhost:19900
          CONF_LOG_PATH: ${{ github.workspace }}/gateway-observe.log
          CONF_REPORT: ${{ github.workspace }}/conformance-report-observe.json
        run: |
          set -euo pipefail
          QUOTA_ENFORCEMENT=observe \
            docker compose ${COMPOSE_FILES} up -d --wait --wait-timeout 180 gateway

          # A replaced container needs a new follower: the one started earlier is
          # still attached to the gateway that was just torn down, and GW-8 reads
          # this file to check the request log.
          nohup docker compose ${COMPOSE_FILES} logs -f --no-color --no-log-prefix gateway \
            > "${CONF_LOG_PATH}" 2>&1 &

          go test -count=1 -timeout 25m ./conformance/...

          # Asserted by name rather than inferred from the exit code. Every
          # enforcement-dependent criterion skips in this mode, so a suite that
          # skipped AC-8 as well would still be green while certifying nothing
          # the first run had not already covered.
          jq -e '.results[] | select(.id == "GW-4.AC-8") | .status == "pass"' \
            "${CONF_REPORT}"

      # GW-12. Response caching is an optional capability, so every run above
      # certifies only its AC-7 — that a deployment which declined a cache never
      # says anything about one. The other six are statements about a gateway
      # that has one, and are unreachable without turning it on. Recreating just
      # the gateway is enough, for the reason the observe-mode step gives, and
      # this run leaves quota enforcement at its default so that the two
      # switches are never flipped at once.
      - name: GW-12 — the suite passes against a gateway with caching enabled
        env:
          CONF_BASE_URL: http://localhost:8080
          CONF_MOCK_PROVIDER: http://mock-provider-a:9900
          CONF_MOCK_CONTROL_URL: http://localhost:19900
          CONF_LOG_PATH: ${{ github.workspace }}/gateway-cache.log
          CONF_REPORT: ${{ github.workspace }}/conformance-report-cache.json
        run: |
          set -euo pipefail
          CACHE_ENABLED=true \
            docker compose ${COMPOSE_FILES} up -d --wait --wait-timeout 180 gateway

          nohup docker compose ${COMPOSE_FILES} logs -f --no-color --no-log-prefix gateway \
            > "${CONF_LOG_PATH}" 2>&1 &

          go test -count=1 -timeout 25m ./conformance/...

          # By name rather than by exit code, for the reason GW-4.AC-8 is: every
          # one of these skips where the capability is unclaimed, so a run that
          # had failed to enable caching would be green having certified nothing
          # the first run did not already cover.
          for ac in 1 2 3 4 5 6; do
            jq -e --arg id "GW-12.AC-${ac}" \
              '.results[] | select(.id == $id) | .status == "pass"' "${CONF_REPORT}"
          done

      - name: Upload the conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: |
            conformance-report*.json
            conformance-junit.xml
            container-report/conformance-report.json
            gateway.log
            gateway-observe.log
            gateway-cache.log
          if-no-files-found: warn

      - name: Print logs on failure
        if: failure()
        run: docker compose ${COMPOSE_FILES} logs --no-color

      - name: Tear down
        if: always()
        run: docker compose ${COMPOSE_FILES} down -v

  # Advisory scan of both Go modules against the Go vulnerability database.
  #
  # govulncheck is invoked directly rather than through a marketplace wrapper:
  # the wrapper adds a second thing that can break, and this is one `go install`
  # and one command. It is not pinned because the analysis is only half the
  # tool -- the advisory data is fetched from vuln.go.dev at run time, and the
  # scanner you least want frozen at an old release is the security one.
  #
  # check-latest matters more than it looks. govulncheck reports standard
  # library vulnerabilities against the toolchain that compiled the code, and
  # the runner image caches a Go patch release that can be weeks behind. Without
  # this the job reports stdlib advisories that a current 1.26.x has already
  # fixed, and the fix would be "wait for the runner image", which is not a fix.
  #
  # It reports only what the code can actually reach, so a quiet run is not a
  # statement that the dependency graph is current -- keeping it current is
  # .github/dependabot.yml's job. There is no equivalent blocking job for the
  # Java module; Dependabot's own advisory alerts and CodeQL cover it, and
  # OWASP dependency-check needs an NVD API key and minutes per run.
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan the gateway
        working-directory: gateway
        run: govulncheck ./...

      # The GW-10 conformance suite, which is its own module rooted here.
      - name: Scan the conformance suite
        run: govulncheck ./...

spring:
  application:
    name: analytics-java
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cognigate}
    username: ${SPRING_DATASOURCE_USERNAME:cognigate_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cognigate_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
